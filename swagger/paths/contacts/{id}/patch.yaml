tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '9876fecf235d8ed3679b3fc5'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Alex Rand'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380632578971'
          email:
            description: "Contact's email"
            type: string
            example: 'alex@mail.com'
          isFavorite:
            description: 'Is the contact a favorite?'
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: [work, home, personal]
            example: 'personal'
          photo:
            description: "URL to contact's photo"
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dne9sb0jh/image/upload/v1746533077/q5h7zsknzdoizpagls.jpg'
responses:
  '200':
    description: Updates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
